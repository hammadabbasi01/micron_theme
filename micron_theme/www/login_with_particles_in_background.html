<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Spark360</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Gradient Background matching the mockup */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #a5d3f5 0%, #68b3eb 50%, #3a92db 100%);
            z-index: 1;
        }

        /* Glassmorphism Login Container */
        .login-container {
            position: relative;
            width: 420px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            z-index: 10;
        }

        /* Logo Area */
        .logo-area {
            margin-bottom: 12px;
        }
        .logo-area img {
            max-width: 180px;
            height: auto;
        }

        .login-title {
            font-size: 16px;
            color: #1e3a60;
            font-weight: 500;
            margin-bottom: 28px;
        }

        /* Input Styles */
        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: #ffffff;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }

        /* Password Wrapper for Eye Icon */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            font-size: 14px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #0066cc;
        }

        /* Button Style */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #005691;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #004475;
        }

        .login-btn:active {
            transform: scale(0.99);
        }

        /* Footer Links */
        .links-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 13px;
        }

        .links-group a {
            color: #1e3a60;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .links-group a:hover {
            text-decoration: underline;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(30, 58, 96, 0.7);
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="login-container">
        <div class="logo-area">
            <img src="Spark Logo Final 1.jpg" alt="Spark360" onerror="this.src='https://i.imgur.com/eYdCshS.png';">
        </div>
        <div class="login-title">Login to SRP360</div>

        <form onsubmit="event.preventDefault();">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required autocomplete="off">
            </div>

            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="links-group">
            <a href="#">Forgot Password?</a>
            <a href="#">Create an Account</a>
        </div>

        <div class="footer-text">Powered by SRP360</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        /* Particles.js Configuration for the Network Constellation Effect */
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 100,
                    "density": { "enable": true, "value_area": 800 }
                },
                "color": { "value": "#ffffff" },
                "shape": {
                    "type": "circle",
                    "stroke": { "width": 0, "color": "#000000" }
                },
                "opacity": {
                    "value": 0.6,
                    "random": true,
                    "anim": { "enable": true, "speed": 1, "opacity_min": 0.2, "sync": false }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": { "enable": false }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 130,
                    "color": "#ffffff",
                    "opacity": 0.35,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 2,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": { "enable": false, "rotateX": 600, "rotateY": 1200 }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "grab": { "distance": 160, "line_linked": { "opacity": 0.8 } },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });

        /* Dynamic Password Reveal Interaction */
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
